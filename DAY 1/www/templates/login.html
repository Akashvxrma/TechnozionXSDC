<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUMANJI | Authenticate</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --retro-green: #39ff14;
            --retro-yellow: #fefe33;
            --term-green: #00ff00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: var(--retro-green);
            font-family: 'Press Start 2P', monospace;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            background: url('/static/assets/jumanji_bg.jpg') no-repeat center center;
            background-size: cover;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 0;
        }

        /* CRT Effects */
        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 50;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            background: rgba(0, 0, 0, 0.9);
            border: 4px solid var(--retro-green);
            padding: 40px;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.3);
            text-align: center;
        }

        .jumanji-title {
            font-size: 3rem;
            color: #d4af37;
            letter-spacing: -2px;
            text-shadow: 2px 2px 0 #8b4513, 4px 4px 0 #000;
            margin-bottom: 10px;
        }

        .sub-banner {
            font-size: 0.8rem;
            color: var(--retro-green);
            text-shadow: 0 0 5px #000;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            color: var(--retro-yellow);
            margin-bottom: 10px;
        }

        .form-group input {
            width: 100%;
            background: #000;
            border: 2px solid var(--retro-green);
            color: var(--retro-green);
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            outline: none;
            transition: box-shadow 0.3s;
        }

        .form-group input:focus {
            box-shadow: 0 0 10px var(--retro-green);
        }

        .submit-btn {
            width: 100%;
            background: var(--retro-green);
            color: #000;
            border: none;
            padding: 20px;
            font-family: 'Press Start 2P', monospace;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #fff;
            transform: scale(1.02);
        }

        .flash-messages {
            color: #ff0000;
            font-size: 0.7rem;
            margin-bottom: 20px;
            animation: blink 1s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .oauth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0 20px 0;
            color: #888;
            font-size: 0.6rem;
            letter-spacing: 1px;
        }

        .oauth-divider::before,
        .oauth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px dashed var(--retro-green);
            opacity: 0.5;
        }

        .oauth-divider:not(:empty)::before {
            margin-right: 12px;
        }

        .oauth-divider:not(:empty)::after {
            margin-left: 12px;
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            padding: 16px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.72rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .google-btn:hover {
            background: #fff;
            color: #000;
            border-color: var(--retro-green);
            box-shadow: 0 0 20px var(--retro-green);
            transform: scale(1.02);
        }

        .google-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }
    </style>
</head>

<body class="crt">

    <div class="auth-container">
        <div class="jumanji-title">JUMANJI</div>
        <div class="sub-banner">AUTHENTICATION REQUIRED</div>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash-messages">
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label>USERNAME</label>
                <input type="text" name="username" autocomplete="off" required>
            </div>
            <div class="form-group">
                <label>PASSWORD</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="submit-btn">ACCESS MAINFRAME</button>
        </form>
        <div class="oauth-divider">
            <span>OR ENTER WITH GOOGLE</span>
        </div>

        <a href="{{ url_for('google_login') }}" class="google-btn">
            <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>LOGIN WITH GOOGLE</span>
        </a>
    </div>

</body>

</html>
