<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/jumanji_design_system.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/jumanji_auth.css') }}">
    <title>Jumanji · Register</title>
</head>

<body class="auth scene">
    <div class="crt-overlay" aria-hidden="true"></div>

    <main class="lid wood">
        <span class="rivet rivet--tl" aria-hidden="true"></span>
        <span class="rivet rivet--tr" aria-hidden="true"></span>
        <span class="rivet rivet--bl" aria-hidden="true"></span>
        <span class="rivet rivet--br" aria-hidden="true"></span>

        <h1 class="carved lid__title">Jumanji</h1>
        <p class="lid__sub">Technozion X SDC Cyber Tournament</p>

        <section class="pass parchment">
            <h2 class="pass__heading">Register a player</h2>
            <p class="pass__lede">Pick a username and password to sign in with.</p>

            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="notice" role="alert">
                {% for message in messages %}<p>{{ message }}</p>{% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form action="{{ url_for('register') }}" method="POST">
                <div>
                    <label for="username">Username</label>
                    <input class="field" type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
                </div>
                <div>
                    <label for="password">Password</label>
                    <input class="field" type="password" id="password" name="password" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn--gold btn--block">Register</button>
            </form>
        </section>

        <p class="lid__foot">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
    </main>
</body>

</html>
