# Nginx site config for cyber.games.sdcnitw.in (installed to /etc/nginx/sites-available/jumanji-ctf by deploy/deploy.sh)

# Brotli for dynamic responses (HTML/JSON); gzip stays on as the fallback (nginx.conf)
brotli on;
brotli_comp_level 5;
brotli_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

# Fingerprinted assets (?v=<hash> from Flask url_for) never change at a given URL
map $arg_v $static_cache_control {
    ""      "public, max-age=2592000, no-transform";
    default "public, max-age=31536000, immutable, no-transform";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name cyber.games.sdcnitw.in 54.206.234.55 54.206.234.55.nip.io _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://cyber.games.sdcnitw.in$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

    server_name cyber.games.sdcnitw.in 54.206.234.55 54.206.234.55.nip.io _;

    ssl_certificate /etc/letsencrypt/live/cyber.games.sdcnitw.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cyber.games.sdcnitw.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # High-Performance Static Asset Delivery with Byte-Range Streaming & 30-Day Browser Caching
    location /static/ {
        alias /var/www/jumanji-static/;
        add_header Cache-Control $static_cache_control;
        sendfile on;
        sendfile_max_chunk 1m;
        tcp_nopush on;
        tcp_nodelay on;
        open_file_cache max=1000 inactive=20m;
        open_file_cache_valid 30s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;
    }

    # Minified, content-hashed build output (tools/build_static.py): immutable, served from precompressed .br/.gz
    location /static/dist/ {
        alias /var/www/jumanji-static/dist/;
        brotli_static on;
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
        sendfile on;
        tcp_nopush on;
        open_file_cache max=1000 inactive=20m;
        open_file_cache_valid 30s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;
    }

    # Self-hosted Google Fonts: file names are upstream content hashes, so they never change
    location /static/vendor/fonts/ {
        alias /var/www/jumanji-static/vendor/fonts/;
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
        sendfile on;
        open_file_cache max=1000 inactive=20m;
        open_file_cache_valid 30s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:8080/socket.io/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
