<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUMANJI | Authenticate</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --retro-green: #39ff14;
            --retro-yellow: #fefe33;
            --term-green: #00ff00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #000;
            color: var(--retro-green);
            font-family: 'Press Start 2P', monospace;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            background: url('/static/assets/jumanji_bg.jpg') no-repeat center center;
            background-size: cover;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85); 
            z-index: 0;
        }

        /* CRT Effects */
        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 50;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            background: rgba(0, 0, 0, 0.9);
            border: 4px solid var(--retro-green);
            padding: 40px;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.3);
            text-align: center;
        }

        .jumanji-title {
            font-size: 3rem;
            color: #d4af37;
            letter-spacing: -2px;
            text-shadow: 2px 2px 0 #8b4513, 4px 4px 0 #000;
            margin-bottom: 10px;
        }

        .sub-banner {
            font-size: 0.8rem;
            color: var(--retro-green);
            text-shadow: 0 0 5px #000;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            color: var(--retro-yellow);
            margin-bottom: 10px;
        }

        .form-group input {
            width: 100%;
            background: #000;
            border: 2px solid var(--retro-green);
            color: var(--retro-green);
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            outline: none;
            transition: box-shadow 0.3s;
        }

        .form-group input:focus {
            box-shadow: 0 0 10px var(--retro-green);
        }

        .submit-btn {
            width: 100%;
            background: var(--retro-green);
            color: #000;
            border: none;
            padding: 20px;
            font-family: 'Press Start 2P', monospace;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #fff;
            transform: scale(1.02);
        }

        .flash-messages {
            color: #ff0000;
            font-size: 0.7rem;
            margin-bottom: 20px;
            animation: blink 1s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    </style>
</head>
<body class="crt">
    
    <div class="auth-container">
        <div class="jumanji-title">JUMANJI</div>
        <div class="sub-banner">PLAYER REGISTRATION<br>ENLIST NOW</div>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash-messages">
              {% for message in messages %}
                <p>{{ message }}</p>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('register') }}" method="POST">
            <div class="form-group">
                <label>NEW USERNAME</label>
                <input type="text" name="username" autocomplete="off" required>
            </div>
            <div class="form-group">
                <label>NEW PASSWORD</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="submit-btn">REGISTER PLAYER</button>
        </form>
        <div style="margin-top: 20px;">
            <a href="{{ url_for('login') }}" style="color: var(--retro-yellow); font-size: 0.7rem; text-decoration: none;">[ BACK TO LOGIN ]</a>
        </div>
    </div>

</body>
</html>
